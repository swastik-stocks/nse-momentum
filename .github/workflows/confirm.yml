name: NSE Momentum - 10am Confirmation
on:
  schedule:
  # [FIX] GitHub's native schedule trigger proved unreliable in practice
  # (2026-07-30: runs labeled 09:20/09:35 actually fired at 11:44/12:05
  # IST, 2.5h late) -- removed entirely in favor of cronjob.com for all
  # four checkpoints, matching the already-proven 09:16 approach.
  workflow_dispatch:
    # [FIX] External triggers (e.g. cronjob.com's early ~09:16 checkpoint) hit this
    # path, not the schedule path. github.event.schedule is ALWAYS empty here, so
    # without explicit inputs the checkpoint-label step below fell through to its
    # "*" branch: label=manual, final=--final. That silently treated every
    # externally-triggered early check as the FINAL checkpoint of the day, which
    # (per the multi-checkpoint terminal-status caching) means the real 09:55 run
    # would reuse thin, premature classifications instead of re-checking them --
    # quietly reproducing the "missed" problem via a different mechanism.
    inputs:
      checkpoint_label:
        description: 'Checkpoint label for external/manual triggers (e.g. 09:16). Leave blank for default manual/final behaviour.'
        required: false
        default: ''
      is_final:
        description: 'Treat this run as the FINAL checkpoint of the day (sends full summary + marks terminal)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
permissions:
  actions: read
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install python-dotenv requests yfinance loguru
          pip install git+https://github.com/rongardF/tvdatafeed.git || echo "tvDatafeed install failed - RVOL will use yfinance fallback"

      - name: Find latest successful scan run
        id: find_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily_scan.yml/runs?status=success&per_page=1" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['workflow_runs'][0]['id'])")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using scan run: $run_id"

      - name: Download picks artifact
        uses: actions/download-artifact@v4
        with:
          name: picks_latest
          path: .
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Multi-checkpoint state persistence ──────────────────────────────────
      # Each scheduled trigger below is a completely fresh VM -- nothing on
      # disk survives between the 09:20/09:35/09:55 runs automatically. These
      # steps find and download THIS SAME workflow's own most recent earlier
      # run from today (if any) and pull down its saved confirm_state_*.json,
      # so confirm_picks.py's --checkpoint caching actually works across the
      # three runs instead of every run treating itself as the first of the day.

      - name: Find today's earlier checkpoint run (if any)
        id: find_state_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          run_id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/confirm.yml/runs?status=success&per_page=10" \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          today = '$today'
          current_run_id = '${{ github.run_id }}'
          found = ''
          for run in data.get('workflow_runs', []):
              if str(run['id']) == current_run_id:
                  continue
              if run['created_at'].startswith(today):
                  found = run['id']
                  break
          print(found)
          ")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Found earlier checkpoint run today: '$run_id' (empty = this is the first checkpoint today)"

      - name: Download prior checkpoint state (if any)
        if: steps.find_state_run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true   # first-run-of-the-day case, or artifact expired -- fail soft
        with:
          name: confirm_state
          path: logs
          run-id: ${{ steps.find_state_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine checkpoint label
        id: checkpoint
        run: |
          # [FIX] Prefer an explicit label/final flag passed via workflow_dispatch
          # inputs (e.g. cronjob.com's early trigger) over inferring from
          # github.event.schedule, which is always empty on workflow_dispatch runs.
          # Falls back to the original schedule-matching + manual-defaults-to-final
          # behaviour for the GitHub-native schedule triggers and for anyone
          # clicking "Run workflow" manually in the UI without inputs.
          input_label="${{ github.event.inputs.checkpoint_label }}"
          input_final="${{ github.event.inputs.is_final }}"

          if [ -n "$input_label" ]; then
            echo "label=$input_label" >> "$GITHUB_OUTPUT"
            if [ "$input_final" = "true" ]; then
              echo "final=--final" >> "$GITHUB_OUTPUT"
            else
              echo "final=" >> "$GITHUB_OUTPUT"
            fi
          else
            case "${{ github.event.schedule }}" in
              "50 3 * * 1-5") echo "label=09:20" >> "$GITHUB_OUTPUT"; echo "final=" >> "$GITHUB_OUTPUT" ;;
              "5 4 * * 1-5")  echo "label=09:35" >> "$GITHUB_OUTPUT"; echo "final=" >> "$GITHUB_OUTPUT" ;;
              "25 4 * * 1-5") echo "label=09:55" >> "$GITHUB_OUTPUT"; echo "final=--final" >> "$GITHUB_OUTPUT" ;;
              *) echo "label=manual" >> "$GITHUB_OUTPUT"; echo "final=--final" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
          echo "Checkpoint: $(cat $GITHUB_OUTPUT)"

      - name: Run confirmation checker
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PICKS_JSON_PATH: picks_latest.json
        run: python confirm_picks.py --checkpoint "${{ steps.checkpoint.outputs.label }}" ${{ steps.checkpoint.outputs.final }}

      - name: Upload checkpoint state for next run today
        if: always()   # save state even if the run partly failed -- don't lose progress
        uses: actions/upload-artifact@v4
        with:
          name: confirm_state
          path: logs/confirm_state_*.json
          retention-days: 1
          if-no-files-found: warn
