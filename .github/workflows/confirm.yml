name: NSE Momentum - 10am Confirmation
on:
  workflow_dispatch:
    inputs:
      checkpoint_label:
        description: 'Checkpoint label for external/manual triggers (e.g. 09:16). Leave blank for default manual/final behaviour.'
        required: false
        default: ''
      is_final:
        description: 'Treat this run as the FINAL checkpoint of the day (sends full summary + marks terminal)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      btst:
        description: 'Run the 15:15 BTST closing-strength scan instead of the normal entry-confirmation checkpoint?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
permissions:
  actions: read
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install python-dotenv requests yfinance loguru
          pip install git+https://github.com/rongardF/tvdatafeed.git || echo "tvDatafeed install failed - RVOL will use yfinance fallback"

      - name: Find latest usable scan run
        id: find_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # [FIX 2026-08-11] A daily_scan.yml run can complete all real work
          # (scan + artifact upload) and still be marked "cancelled" overall by
          # GH Actions infra seconds after finishing (seen 2026-08-10: dispatch
          # run 31395814390 uploaded picks_latest fine but the run itself came
          # back "cancelled", so the old status=success query skipped it and
          # fell through to a later backstop run that had SKIPPED the scan
          # entirely -- 0 artifacts, "Download picks artifact" failed).
          # Fix: scan the last 10 completed runs (success OR cancelled) newest
          # first, and trust the first one that actually has a non-expired
          # picks_latest artifact, rather than trusting the run's own verdict.
          run_id=$(python3 <<'PY'
          import json, os, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = "${{ github.repository }}"

          def gh(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
              })
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          runs = gh(f"https://api.github.com/repos/{repo}/actions/workflows/daily_scan.yml/runs?status=completed&per_page=10")["workflow_runs"]
          picked = ""
          for run in runs:
              if run["conclusion"] not in ("success", "cancelled"):
                  continue
              arts = gh(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/artifacts")["artifacts"]
              if any(a["name"] == "picks_latest" and not a["expired"] for a in arts):
                  picked = run["id"]
                  break
          print(picked)
          PY
          )
          if [ -z "$run_id" ]; then
            echo "::error::No daily_scan.yml run in the last 10 completed runs has a usable picks_latest artifact."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using scan run: $run_id"

      - name: Download picks artifact
        uses: actions/download-artifact@v4
        with:
          name: picks_latest
          path: .
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Multi-checkpoint state persistence ──────────────────────────────────
      # Each scheduled trigger below is a completely fresh VM -- nothing on
      # disk survives between the 09:20/09:35/09:55 runs automatically. These
      # steps find and download THIS SAME workflow's own most recent earlier
      # run from today (if any) and pull down its saved confirm_state_*.json,
      # so confirm_picks.py's --checkpoint caching actually works across the
      # three runs instead of every run treating itself as the first of the day.

      - name: Find today's earlier checkpoint run (if any)
        id: find_state_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          run_id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/confirm.yml/runs?status=success&per_page=10" \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          today = '$today'
          current_run_id = '${{ github.run_id }}'
          found = ''
          for run in data.get('workflow_runs', []):
              if str(run['id']) == current_run_id:
                  continue
              if run['created_at'].startswith(today):
                  found = run['id']
                  break
          print(found)
          ")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Found earlier checkpoint run today: '$run_id' (empty = this is the first checkpoint today)"

      - name: Download prior checkpoint state (if any)
        if: steps.find_state_run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true   # first-run-of-the-day case, or artifact expired -- fail soft
        with:
          name: confirm_state
          path: logs
          run-id: ${{ steps.find_state_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine checkpoint label
        id: checkpoint
        run: |
          # [FIX] Prefer an explicit label/final flag passed via workflow_dispatch
          # inputs (e.g. cronjob.com's early trigger) over inferring from
          # github.event.schedule, which is always empty on workflow_dispatch runs.
          # Falls back to the original schedule-matching + manual-defaults-to-final
          # behaviour for the GitHub-native schedule triggers and for anyone
          # clicking "Run workflow" manually in the UI without inputs.
          input_label="${{ github.event.inputs.checkpoint_label }}"
          input_final="${{ github.event.inputs.is_final }}"
          input_btst="${{ github.event.inputs.btst }}"

          if [ "$input_btst" = "true" ]; then
            echo "btst=--btst" >> "$GITHUB_OUTPUT"
          else
            echo "btst=" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$input_label" ]; then
            echo "label=$input_label" >> "$GITHUB_OUTPUT"
            if [ "$input_final" = "true" ]; then
              echo "final=--final" >> "$GITHUB_OUTPUT"
            else
              echo "final=" >> "$GITHUB_OUTPUT"
            fi
          else
            case "${{ github.event.schedule }}" in
              "50 3 * * 1-5") echo "label=09:20" >> "$GITHUB_OUTPUT"; echo "final=" >> "$GITHUB_OUTPUT" ;;
              "5 4 * * 1-5")  echo "label=09:35" >> "$GITHUB_OUTPUT"; echo "final=" >> "$GITHUB_OUTPUT" ;;
              "25 4 * * 1-5") echo "label=09:55" >> "$GITHUB_OUTPUT"; echo "final=--final" >> "$GITHUB_OUTPUT" ;;
              *) echo "label=manual" >> "$GITHUB_OUTPUT"; echo "final=--final" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
          echo "Checkpoint: $(cat $GITHUB_OUTPUT)"

      # [NEW 2026-08-11] Optional CC list, same pattern as daily_scan.yml --
      # kept out of the (public) repo, sourced from the CC_RECIPIENTS secret.
      - name: Write CC recipients file
        env:
          CC_RECIPIENTS: ${{ secrets.CC_RECIPIENTS }}
        run: |
          if [ -n "$CC_RECIPIENTS" ]; then
            printf '%s\n' "$CC_RECIPIENTS" > recipients_cc.txt
          fi

      - name: Run confirmation checker
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PICKS_JSON_PATH: picks_latest.json
        run: python confirm_picks.py --checkpoint "${{ steps.checkpoint.outputs.label }}" ${{ steps.checkpoint.outputs.final }} ${{ steps.checkpoint.outputs.btst }}

      - name: Upload checkpoint state for next run today
        if: always()   # save state even if the run partly failed -- don't lose progress
        uses: actions/upload-artifact@v4
        with:
          name: confirm_state
          path: logs/confirm_state_*.json
          retention-days: 1
          if-no-files-found: warn
