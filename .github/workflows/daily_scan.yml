name: NSE Momentum Daily Scan
on:
  # Primary trigger: cron-job.org POSTs here at 19:30 IST Mon-Fri (see
  # P0 setup notes). GitHub's own `schedule` trigger is best-effort and
  # routinely starts late under platform load, so cron-job.org (which
  # supports IST directly and alerts on failure) now owns the real
  # timing. This event carries no useful payload; it just kicks the scan.
  repository_dispatch:
    types: [evening-scan]
  workflow_dispatch:
    inputs:
      republish_picks_b64:
        description: 'RECOVERY USE ONLY: base64-encoded picks_latest.json content to publish as-is, bypassing the real scan entirely. Used to get a known-good evening-scan artifact back within reach of confirm.yml (see "Find latest usable scan run") when the real evening run failed to produce one and same-day checkpoints would otherwise keep falling back to stale data. Leave blank for a normal scan.'
        required: false
        default: ''
  schedule:
    # 8:30 PM IST = 15:00 UTC — LATE FALLBACK ONLY, ~1 hour after the
    # cron-job.org primary trigger. The `gate` job below skips the scan
    # if scan_metadata already has a row for today, so this only does
    # anything when the primary trigger genuinely failed to fire.
    - cron: '0 15 * * 1-5'
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: github.event_name == 'schedule'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libsql_client
        if: github.event_name == 'schedule'
        run: pip install libsql_client

      - id: check
        name: Check whether today's scan already ran (backstop gate)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            python check_scan_done.py
          fi

  scan:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # [2026-08-20] 30 min wasn't enough headroom once scanner.py started
    # retrying the OHLCV fetch (up to 2 retries x 10 min wait) on top of the
    # downstream breadth-publish steps, which alone take ~25 min. Worst case
    # (2 failed attempts + a 3rd that succeeds) is roughly 20 min of waiting
    # + ~15 min of fetch attempts + ~25 min breadth publish -- 75 min gives
    # real margin instead of getting cut off mid-run again.
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install git+https://github.com/rongardF/tvdatafeed.git || echo "tvDatafeed install failed - RVOL will use yfinance fallback"
          pip install pandas-ta --no-deps || echo "pandas-ta install failed - using manual calculations"

      # [NEW 2026-08-11] Optional CC list for every email this repo sends.
      # Kept out of the repo itself (recipients_cc.txt is gitignored, unlike
      # recipients.txt which is tracked -- see .gitignore) since this repo is
      # public; the actual address lives in the CC_RECIPIENTS secret instead.
      - name: Write CC recipients file
        env:
          CC_RECIPIENTS: ${{ secrets.CC_RECIPIENTS }}
        run: |
          if [ -n "$CC_RECIPIENTS" ]; then
            printf '%s\n' "$CC_RECIPIENTS" > recipients_cc.txt
          fi

      # RECOVERY PATH: writes the supplied artifact straight to
      # picks_latest.json and skips the real scan + breadth-publish steps
      # below entirely, so confirm.yml's same-day checkpoints have
      # something valid to find within a minute or two instead of falling
      # back to a multi-day-old artifact. Base64 in/out avoids any shell
      # quoting issues with the JSON payload.
      - name: Republish supplied picks (bypass scan)
        if: github.event.inputs.republish_picks_b64 != ''
        run: echo "$PICKS_B64" | base64 -d > picks_latest.json
        env:
          PICKS_B64: ${{ github.event.inputs.republish_picks_b64 }}

      - name: Run NSE Momentum Scanner v5.3
        if: github.event.inputs.republish_picks_b64 == ''
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
          DHAN_CLIENT_ID:     ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN:  ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python scanner.py

      # P3-05: Fetch MCap from NSE's official daily PR Bhavcopy zip.
      # Runs before sector_breadth.py so MCap weights are in Turso when
      # sector_breadth reads them for MCap-weighted SMA50 breadth.
      # Skipped on the recovery path -- nothing here reads picks_latest.json
      # and this run isn't tonight's real breadth data, so there's no point
      # spending ~20 min on it just to republish an artifact fast.
      - name: Fetch market cap data (P3-05)
        if: always() && github.event.inputs.republish_picks_b64 == ''
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python fetch_mcap.py

      # P1-05: Publish the NSE symbol master (equities + ETFs, ISIN + company
      # name per symbol) to Turso nightly, so Portfolio Dashboard can resolve
      # holdings symbols/company names by querying the shared DB directly —
      # no cross-repo import of this repo's resolver needed.
      - name: Publish NSE symbol master (P1-05)
        if: always() && github.event.inputs.republish_picks_b64 == ''
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python publish_symbol_master.py

      # P3-01/02/06: Sector breadth grid — runs after scanner.py so the
      # Bhavcopy cache written by that run is available for P3-06 metrics.
      # Reads ticker_mcap (P3-05) for MCap-weighted SMA50 breadth.
      # publish_ticker_sector_map() also runs here (P3-08), so industry_breadth
      # (which reads ticker_sector_map from Turso) must come after this step.
      - name: Publish sector breadth (P3-01/02/06/08) with MCap weighting (P3-05)
        if: always() && github.event.inputs.republish_picks_b64 == ''
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python sector_breadth.py

      # P3-03/04: Industry breadth grid (138 industries via Screener.in).
      # Depends on ticker_sector_map published by sector_breadth.py above.
      - name: Publish industry breadth (P3-03/04)
        if: always() && github.event.inputs.republish_picks_b64 == ''
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python industry_breadth.py

      - name: Upload scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-log-${{ github.run_number }}
          path: logs/
          retention-days: 7

      - name: Upload picks for confirmation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picks_latest
          path: picks_latest.json
          retention-days: 3
